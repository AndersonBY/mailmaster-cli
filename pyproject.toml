[project]
name = "mailmaster"
version = "0.1.0"
description = "Read NetEase MailMaster local data and send email — usable as both a Python library and CLI tool."
readme = "README_EN.md"
requires-python = ">=3.11"
keywords = ["mail", "email", "smtp", "cli", "mailmaster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "cryptography>=44.0.0",
  "dnspython>=2.6.0",
  "latex2mathml>=3.78.1",
  "markdown2>=2.5.4",
  "rich>=13.9.4",
  "typer>=0.16.0",
]

[project.optional-dependencies]
latex-image = [
  "matplotlib>=3.10.8",
]

[project.scripts]
mailmaster = "mailmaster.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["ref"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

